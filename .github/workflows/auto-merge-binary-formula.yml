name: Auto merge binary formula bumps

on:
  workflow_run:
    workflows: ["brew test-bot"]
    types:
      - completed

permissions:
  contents: read

jobs:
  merge:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Create GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.HOMEBREW_TAP_APP_ID }}
          private-key: ${{ secrets.HOMEBREW_TAP_PRIVATE_KEY }}

      - name: Merge binary formula bump
        uses: actions/github-script@v7
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            const prs = context.payload.workflow_run.pull_requests || [];
            if (prs.length === 0) {
              core.info("No pull request is associated with this workflow run.");
              return;
            }

            const BINARY_FORMULAE = [
              "agent-layer",
            ];

            const prNumber = prs[0].number;
            const { owner, repo } = context.repo;
            const { data: pr } = await github.rest.pulls.get({
              owner,
              repo,
              pull_number: prNumber,
            });

            const login = pr.user?.login || "";
            const headRef = pr.head?.ref || "";
            const headSha = pr.head?.sha || "";
            const labels = (pr.labels || []).map(label => label.name);
            const formula = BINARY_FORMULAE.find(name => headRef.startsWith(`bump-${name}-v`));
            const isReleaseBot = /^conn-castle-release-bot(\[bot\])?$/.test(login);
            const isSameRepo = pr.head?.repo?.full_name === `${owner}/${repo}`;

            if (!formula || !isReleaseBot || !isSameRepo) {
              core.info(`Not merging PR #${prNumber}: login=${login}, sameRepo=${isSameRepo}, headRef=${headRef}`);
              return;
            }

            if (labels.includes("pr-pull")) {
              core.setFailed(`Refusing to merge PR #${prNumber}: binary formula bumps must not use pr-pull.`);
              return;
            }

            if (pr.draft) {
              core.info(`Not merging PR #${prNumber}: PR is a draft.`);
              return;
            }

            const workflowHeadSha = context.payload.workflow_run.head_sha || "";
            if (headSha !== workflowHeadSha) {
              core.info(`Not merging PR #${prNumber}: workflow run SHA ${workflowHeadSha} is stale; current PR head is ${headSha}.`);
              return;
            }

            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner,
              repo,
              pull_number: prNumber,
              per_page: 100,
            });
            const changedFiles = files.map(file => file.filename).sort();
            const expectedFile = `Formula/${formula}.rb`;
            const unexpectedFiles = changedFiles.filter(file => file !== expectedFile);
            if (changedFiles.length !== 1 || unexpectedFiles.length > 0) {
              core.setFailed(`Refusing to merge PR #${prNumber}: expected only ${expectedFile}, got ${changedFiles.join(", ") || "(no files)"}.`);
              return;
            }

            const merge = await github.rest.pulls.merge({
              owner,
              repo,
              pull_number: prNumber,
              merge_method: "squash",
              commit_title: pr.title,
              commit_message: pr.body || "",
            });
            core.info(`Merged PR #${prNumber}: ${merge.data.sha}`);

            try {
              await github.rest.git.deleteRef({
                owner,
                repo,
                ref: `heads/${headRef}`,
              });
              core.info(`Deleted branch ${headRef}.`);
            } catch (error) {
              core.warning(`Merged PR #${prNumber}, but could not delete branch ${headRef}: ${error.message}`);
            }
